[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "nirnaya"
version = "1.0.0"
description = "Calibrated typed decisions (choice, yes/no, score) in one non-generative forward pass"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
  "huggingface-hub>=0.34,<2",
  "mlx>=0.32.2,<0.33; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "numpy>=2,<3",
  "tokenizers>=0.21,<1",
]

[project.optional-dependencies]
torch = [
  "safetensors>=0.4,<1",
  "torch>=2.14,<3",
  "transformers>=5.18,<6",
]
test = ["pytest>=8,<9"]

[project.urls]
Homepage = "https://biswa-mohapatro.github.io/nirnaya/"
Repository = "https://github.com/biswa-mohapatro/nirnaya"
Model = "https://huggingface.co/9337aaric/Nirnaya-Flash"

[project.scripts]
nirnaya-serve = "nirnaya.serve:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nirnaya"]
